[project]
name = "ai-product-discovery-api"
version = "0.1.0"
description = "Backend API for the AI Product Discovery Engine"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "httpx",
    "langdetect",
    "google-play-scraper",
    "app-reviews",
    "google-api-python-client",
    "sentence-transformers",
    "scikit-learn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]